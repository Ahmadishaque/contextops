services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: contextops-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://contextops:contextops@postgres:5432/contextops
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: mock
      PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - qdrant
      - redis
